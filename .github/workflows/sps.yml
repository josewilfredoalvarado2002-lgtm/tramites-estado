name: Gestiones de la Municipalidad de San Pedro Sula

on:
  schedule:
    # Lunes a las 13:00 UTC = 07:00 en Honduras
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sps-gestiones
  cancel-in-progress: false

jobs:
  sps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Tegucigalpa
      OBSIDIAN_CARPETA: ${{ github.workspace }}/10 Trámites del Estado/Municipalidad de San Pedro Sula
      PAUSA_SEGUNDOS: "1.5"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Instalar dependencias
        run: python3 -m pip install --quiet --break-system-packages -r sps/requirements.txt

      - name: Leer el portal de gestiones de San Pedro Sula
        run: python3 -W ignore sps/crawler.py

      - name: Guardar los cambios en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "10 Trámites del Estado/Municipalidad de San Pedro Sula" sps/gestiones.json sps/gestiones.csv
          if git diff --cached --quiet; then echo "Sin cambios que guardar."; exit 0; fi
          git commit -m "San Pedro Sula $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase --quiet
          git push
